<section class="publications section" id="publications">
  <h2 class="section__title">Publications</h2>
  <span class="section__subtitle">Scientific work</span>

  <div class="publications__container container grid">
    {% for publication in publications %}
      <div class="publications__content">
        <div>
          <h3 class="publications__title">
            {{ publication.title }}
          </h3>
        </div>

        <a href="{{ publication.url }}" target="_blank" rel="noopener noreferrer"
           class="button button--flex button--small button--link publications__button">
          View More
          <i class="uil uil-arrow-right button__icon" aria-hidden="true"></i>
        </a>
      </div>
    {% endfor %}
  </div>
</section>
