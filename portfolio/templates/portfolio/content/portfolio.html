<section class="portfolio section" id="portfolio">
  <h2 class="section__title">Portfolio</h2>
  <div class="span section__subtitle">Some of my projects</div>

  <div class="swiper portfolio__container container">
    <div class="swiper-wrapper">
      {% for project in projects %}
        <div class="portfolio__content grid swiper-slide">
          <img src="{{ project.image.url }}" alt="" class="portfolio__Img">

          <div class="portfolio__data">
            <h3 class="portfolio__title">{{ project.title }}</h3>

            <p class="portfolio__description">
              {{ project.description }}
            </p>

            <a href="{{ project.url }}" class="button button--flex button--small portfolio__button">
              See project
              <i class="uil uil-arrow-right button__icon"></i>
            </a>
          </div>
        </div>
      {% endfor %}

    </div>

    <!-- Add Arrows -->
    <div class="swiper-button-next">
      <i class="uil uil-angle-right-b swiper-portfolio-icon"></i>
    </div>

    <div class="swiper-button-prev">
      <i class="uil uil-angle-left-b swiper-portfolio-icon"></i>
    </div>

    <!-- Add Pagination -->
    <div class="swiper-pagination"></div>
  </div>
</section>
