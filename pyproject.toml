[project]
name = "acalmo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2.8",
    "django-environ>=0.12.0",
    "django-ratelimit>=4.1.0",
    "django-recaptcha>=4.1.0",
    "django-storages[google]>=1.14.6",
    "gunicorn>=23.0.0",
    "pillow>=12.0.0",
    "psycopg>=3.2.12",
    "psycopg-binary>=3.2.12",
]

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "acalmo.settings"

[[tool.mypy.overrides]]
module = ["environ.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pre-commit>=4.5.1",
    "ruff>=0.15.5",
]
