steps:
  # Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    env:
      - 'DOCKER_BUILDKIT=1'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:${SHORT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:latest'
      - '.'

  # Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE}:${SHORT_SHA}'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'DJANGO_SETTINGS_MODULE=acalmo.settings.production'
      - '--set-secrets'
      - 'SECRET_KEY=secret-key:latest,DEBUG=debug:latest,SECURE_SSL_REDIRECT=secure-ssl-redirect:latest,SESSION_COOKIE_SECURE=session-cookie-secure:latest,CSRF_COOKIE_SECURE=csrf-cookie-secure:latest,DB_NAME=db-name:latest,DB_USER=db-user:latest,DB_PASSWORD=db-password:latest,DB_HOST=db-host:latest,STORAGE_DEFAULT_BACKEND=storage-default-backend:latest,STORAGE_STATIC_BACKEND=storage-static-backend:latest,GS_BUCKET_NAME=gs-bucket-name:latest,GS_PROJECT_ID=gs-project-id:latest,EMAIL_BACKEND=email-backend:latest,EMAIL_HOST=email-host:latest,EMAIL_PORT=email-port:latest,EMAIL_HOST_USER=email-host-user:latest,EMAIL_HOST_PASSWORD=email-host-password:latest,EMAIL_USE_TLS=email-use-tls:latest'
      - '--service-account'
      - '${_SERVICE_ACCOUNT}'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--timeout'
      - '900'
      - '--concurrency'
      - '100'
      - '--max-instances'
      - '5'
      - '--min-instances'
      - '0'

substitutions:
  _REGION: us-central1
  _REPOSITORY: acalmo-web
  _IMAGE: acalmo-web
  _SERVICE_NAME: acalmo-web-service
  _SERVICE_ACCOUNT: acalmo-web-sa@${PROJECT_ID}.iam.gserviceaccount.com

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
