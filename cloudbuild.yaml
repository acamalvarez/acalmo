steps:
# Build the image
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', '$LOCATION-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}/${_SERVICE_NAME}:$COMMIT_SHA', '.']
  env:
  - 'DOCKER_BUILDKIT=1'

# Push the image to Artifact Registry
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', '$LOCATION-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}/${_SERVICE_NAME}:$COMMIT_SHA']

# Run migrations
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args:
    - 'run'
    - 'jobs'
    - 'create'
    - 'acalmo-migrations'
    - '--image'
    - '$LOCATION-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}/${_SERVICE_NAME}:$COMMIT_SHA'
    - '--region'
    - '${_SERVICE_REGION}'
    - '--service-account'
    - '${_SERVICE_ACCOUNT}'
    - '--set-secrets'
    - 'SECRET_KEY=secret-key:latest'
    - '--set-secrets'
    - 'DB_NAME=db-name:latest'
    - '--set-secrets'
    - 'DB_USER=db-user:latest'
    - '--set-secrets'
    - 'DB_PASSWORD=db-password:latest'
    - '--set-secrets'
    - 'DB_HOST=db-host:latest'
    - '--set-secrets'
    - 'DB_PORT=db-port:latest'
    - '--command'
    - 'python'
    - '--args'
    - 'manage.py,migrate'
    - '--execute-now'

# Deploy image to Cloud Run
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args: 
    - 'run'
    - 'deploy'
    - '${_SERVICE_NAME}'
    - '--image'
    - '$LOCATION-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}/${_SERVICE_NAME}:$COMMIT_SHA'
    - '--region'
    - '${_SERVICE_REGION}'
    - '--set-secrets'
    - 'SECRET_KEY=secret-key:latest'
    - '--set-secrets'
    - 'DB_NAME=db-name:latest'
    - '--set-secrets'
    - 'DB_USER=db-user:latest'
    - '--set-secrets'
    - 'DB_PASSWORD=db-password:latest'
    - '--set-secrets'
    - 'DB_HOST=db-host:latest'
    - '--set-secrets'
    - 'DB_PORT=db-port:latest'
    - '--service-account'
    - '${_SERVICE_ACCOUNT}'

images:
- '$LOCATION-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}/${_SERVICE_NAME}:$COMMIT_SHA'
substitutions:
  _SERVICE_NAME: 'acalmo-web-service'
  _SERVICE_REGION: 'us-central1'
  _REPOSITORY: 'acalmo-web'
  _IMAGE: 'acalmo-web'
  _SERVICE_ACCOUNT: 'acalmo-web-sa@${PROJECT_ID}.iam.gserviceaccount.com'

options:
  logging: CLOUD_LOGGING_ONLY