steps:
# 1. Pull the latest image to use as a cache source
- name: 'gcr.io/cloud-builders/docker'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      docker pull $_AR_IMAGE:latest || exit 0
  id: 'pull-cache'

# 2. Build the image with caching and dual tags (SHA and latest)
- name: 'gcr.io/cloud-builders/docker'
  args: [
    'build', 
    '-t', '$_AR_IMAGE:$COMMIT_SHA', 
    '-t', '$_AR_IMAGE:latest',
    '--cache-from', '$_AR_IMAGE:latest',
    '.'
  ]
  env:
  - 'DOCKER_BUILDKIT=1'
  id: 'build-image'
  waitFor: ['pull-cache']

# 3. Push both tags to Artifact Registry
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', '--all-tags', '$_AR_IMAGE']
  id: 'push-image'
  waitFor: ['build-image']

# 4. Collect Static (Runs in parallel with Migrations)
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      gcloud run jobs deploy acalmo-collectstatic \
        --image $_AR_IMAGE:$COMMIT_SHA \
        --region ${_SERVICE_REGION} \
        --service-account ${_SERVICE_ACCOUNT} \
        ${_COMMON_FLAGS} \
        --command python --args manage.py,collectstatic,--noinput && \
      gcloud run jobs execute acalmo-collectstatic --region ${_SERVICE_REGION} --wait
  id: 'collect-static'
  waitFor: ['push-image']

# 5. Run Migrations (Runs in parallel with Collect Static)
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      gcloud run jobs deploy acalmo-migrate \
        --image $_AR_IMAGE:$COMMIT_SHA \
        --region ${_SERVICE_REGION} \
        --service-account ${_SERVICE_ACCOUNT} \
        ${_COMMON_FLAGS} \
        --command python --args manage.py,migrate && \
      gcloud run jobs execute acalmo-migrate --region ${_SERVICE_REGION} --wait
  id: 'run-migrations'
  waitFor: ['push-image']

# 6. Deploy to Cloud Run
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      gcloud run deploy ${_SERVICE_NAME} \
        --image $_AR_IMAGE:$COMMIT_SHA \
        --region ${_SERVICE_REGION} \
        --service-account ${_SERVICE_ACCOUNT} \
        ${_COMMON_FLAGS}
  id: 'deploy'
  waitFor: ['collect-static', 'run-migrations']

images:
- '$_AR_IMAGE:$COMMIT_SHA'
- '$_AR_IMAGE:latest'

substitutions:
  _AR_IMAGE: '$LOCATION-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}/${_SERVICE_NAME}'
  _SERVICE_NAME: 'acalmo-web-service'
  _SERVICE_REGION: 'us-central1'
  _REPOSITORY: 'acalmo-web'
  _IMAGE: 'acalmo-web'
  _SERVICE_ACCOUNT: 'acalmo-web-sa@${PROJECT_ID}.iam.gserviceaccount.com'
  # Consolidating all flags (env-vars and secrets) into a single substitution
  _COMMON_FLAGS: >-
    --set-env-vars=DJANGO_SETTINGS_MODULE=acalmo.settings
    --set-secrets=SECRET_KEY=secret-key:latest,ALLOWED_HOSTS=allowed-hosts:latest,DATABASE_URL=database-url:latest,STORAGE_DEFAULT_BACKEND=storage-default-backend:latest,STORAGE_STATIC_BACKEND=storage-static-backend:latest,GS_BUCKET_NAME=gs-bucket-name:latest,GS_PROJECT_ID=gs-project-id:latest,EMAIL_BACKEND=email-backend:latest,EMAIL_HOST=email-host:latest,EMAIL_HOST_PASSWORD=email-host-password:latest,EMAIL_HOST_USER=email-host-user:latest,EMAIL_PORT=email-port:latest,SESSION_COOKIE_SECURE=session-cookie-secure:latest,CSRF_COOKIE_SECURE=csrf-cookie-secure:latest,CSRF_TRUSTED_ORIGINS=csrf-trusted-origins:latest,CACHE_BACKEND=cache-backend:latest,CACHE_LOCATION=cache-location:latest

options:
  logging: CLOUD_LOGGING_ONLY
  dynamic_substitutions: true
