steps:
# Build the image
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', '$LOCATION-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}/${_SERVICE_NAME}:$COMMIT_SHA', '.']
  env:
  - 'DOCKER_BUILDKIT=1'

# Push the image to Artifact Registry
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', '$LOCATION-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}/${_SERVICE_NAME}:$COMMIT_SHA']

# Collect Static
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args:
    - 'run'
    - 'jobs'
    - 'create'
    - 'acalmo-collectstatic-$SHORT_SHA'
    - '--image'
    - '$LOCATION-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}/${_SERVICE_NAME}:$COMMIT_SHA'
    - '--region'
    - '${_SERVICE_REGION}'
    - '--service-account'
    - '${_SERVICE_ACCOUNT}'
    - '--set-env-vars'
    - 'DJANGO_SETTINGS_MODULE=acalmo.settings'
    - '--set-secrets'
    - 'SECRET_KEY=secret-key:latest'
    - '--set-secrets'
    - 'ALLOWED_HOSTS=allowed-hosts:latest'
    - '--set-secrets'
    - 'DATABASE_URL=database-url:latest'
    - '--set-secrets'
    - 'STORAGE_DEFAULT_BACKEND=storage-default-backend:latest'
    - '--set-secrets'
    - 'STORAGE_STATIC_BACKEND=storage-static-backend:latest'
    - '--set-secrets'
    - 'GS_BUCKET_NAME=gs-bucket-name:latest'
    - '--set-secrets'
    - 'GS_PROJECT_ID=gs-project-id:latest'
    - '--set-secrets'
    - 'EMAIL_BACKEND=email-backend:latest'
    - '--set-secrets'
    - 'EMAIL_HOST=email-host:latest'
    - '--set-secrets'
    - 'EMAIL_HOST_PASSWORD=email-host-password:latest'
    - '--set-secrets'
    - 'EMAIL_HOST_USER=email-host-user:latest'
    - '--set-secrets'
    - 'EMAIL_PORT=email-port:latest'
    - '--set-secrets'
    - 'SESSION_COOKIE_SECURE=session-cookie-secure:latest'
    - '--set-secrets'
    - 'CSRF_COOKIE_SECURE=csrf-cookie-secure:latest'
    - '--set-secrets'
    - 'CSRF_TRUSTED_ORIGINS=csrf-trusted-origins:latest'
    - '--set-secrets'
    - 'CACHE_BACKEND=cache-backend:latest'
    - '--set-secrets'
    - 'CACHE_LOCATION=cache-location:latest'
    - '--command'
    - 'python'
    - '--args'
    - 'manage.py,collectstatic,--noinput'
    - '--execute-now'

# Run Migrations
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args:
    - 'run'
    - 'jobs'
    - 'create'
    - 'acalmo-migrate-$SHORT_SHA'
    - '--image'
    - '$LOCATION-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}/${_SERVICE_NAME}:$COMMIT_SHA'
    - '--region'
    - '${_SERVICE_REGION}'
    - '--service-account'
    - '${_SERVICE_ACCOUNT}'
    - '--set-env-vars'
    - 'DJANGO_SETTINGS_MODULE=acalmo.settings'
    - '--set-secrets'
    - 'SECRET_KEY=secret-key:latest'
    - '--set-secrets'
    - 'ALLOWED_HOSTS=allowed-hosts:latest'
    - '--set-secrets'
    - 'DATABASE_URL=database-url:latest'
    - '--set-secrets'
    - 'STORAGE_DEFAULT_BACKEND=storage-default-backend:latest'
    - '--set-secrets'
    - 'STORAGE_STATIC_BACKEND=storage-static-backend:latest'
    - '--set-secrets'
    - 'GS_BUCKET_NAME=gs-bucket-name:latest'
    - '--set-secrets'
    - 'GS_PROJECT_ID=gs-project-id:latest'
    - '--set-secrets'
    - 'EMAIL_BACKEND=email-backend:latest'
    - '--set-secrets'
    - 'EMAIL_HOST=email-host:latest'
    - '--set-secrets'
    - 'EMAIL_HOST_PASSWORD=email-host-password:latest'
    - '--set-secrets'
    - 'EMAIL_HOST_USER=email-host-user:latest'
    - '--set-secrets'
    - 'EMAIL_PORT=email-port:latest'
    - '--set-secrets'
    - 'SESSION_COOKIE_SECURE=session-cookie-secure:latest'
    - '--set-secrets'
    - 'CSRF_COOKIE_SECURE=csrf-cookie-secure:latest'
    - '--set-secrets'
    - 'CSRF_TRUSTED_ORIGINS=csrf-trusted-origins:latest'
    - '--set-secrets'
    - 'CACHE_BACKEND=cache-backend:latest'
    - '--set-secrets'
    - 'CACHE_LOCATION=cache-location:latest'
    - '--command'
    - 'python'
    - '--args'
    - 'manage.py,migrate'
    - '--execute-now'

