#     - '--set-secrets'
#     - 'GS_PROJECT_ID=gs-project-id:latest'
#     - '--command'
#     - 'python'
#     - '--args'
#     - 'manage.py,collectstatic,--noinput'
#     - '--execute-now'

# Deploy image to Cloud Run
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args: 
    - 'run'
    - 'deploy'
    - '${_SERVICE_NAME}'
    - '--image'
    - '$LOCATION-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}/${_SERVICE_NAME}:$COMMIT_SHA'
    - '--region'
    - '${_SERVICE_REGION}'
    - '--set-env-vars'
    - 'DJANGO_SETTINGS_MODULE=acalmo.settings'
    - '--set-secrets'
    - 'SECRET_KEY=secret-key:latest'
    - '--set-secrets'
    - 'ALLOWED_HOSTS=allowed-hosts:latest'
    - '--set-secrets'
    - 'DATABASE_URL=database-url:latest'
    - '--set-secrets'
    - 'STORAGE_DEFAULT_BACKEND=storage-default-backend:latest'
    - '--set-secrets'
    - 'STORAGE_STATIC_BACKEND=storage-static-backend:latest'
    - '--set-secrets'
    - 'GS_BUCKET_NAME=gs-bucket-name:latest'
    - '--set-secrets'
    - 'GS_PROJECT_ID=gs-project-id:latest'
    - '--service-account'
    - '${_SERVICE_ACCOUNT}'

images:
- '$LOCATION-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}/${_SERVICE_NAME}:$COMMIT_SHA'
substitutions:
  _SERVICE_NAME: 'acalmo-web-service'
  _SERVICE_REGION: 'us-central1'
  _REPOSITORY: 'acalmo-web'
  _IMAGE: 'acalmo-web'
  _SERVICE_ACCOUNT: 'acalmo-web-sa@${PROJECT_ID}.iam.gserviceaccount.com'

options:
  logging: CLOUD_LOGGING_ONLY